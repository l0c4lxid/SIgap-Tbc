name: Deploy SITUBA

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, iconv, sockets, gd, zip, fileinfo
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm run build

      - name: Ensure Vite hot file is removed
        run: |
          rm -f public/hot

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH and known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Try keyscan with fallback to disable strict checking if server blocks scan
          ssh-keyscan -p "${SSH_PORT:-22}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host *
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts 2>/dev/null || true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Pre-deploy server cleanup (Free disk space)
        run: |
          ssh ${SSH_USER}@${SSH_HOST} <<'EOF'
          # Truncate old Laravel logs
          if [ -d "/home/situbamy/situba/storage/logs" ]; then
            find /home/situbamy/situba/storage/logs -type f -name "*.log" -exec truncate -s 0 {} + 2>/dev/null || true
          fi

          # Clear view and cache files on server
          rm -rf /home/situbamy/situba/storage/framework/cache/data/* 2>/dev/null || true
          rm -rf /home/situbamy/situba/storage/framework/views/*.php 2>/dev/null || true

          # Clean cPanel trash & temp files
          rm -rf ~/.trash/* ~/.trash/.* 2>/dev/null || true
          rm -rf ~/tmp/* 2>/dev/null || true
          EOF
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Rsync project to server
        run: |
          rsync -az \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='.editorconfig' \
            --exclude='phpunit.xml' \
            --exclude='pint.json' \
            --exclude='phpstan.neon*' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ ${SSH_USER}@${SSH_HOST}:/home/situbamy/situba
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}


      - name: Rsync public to web root
        run: |
          rsync -az \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='index.php' \
            ./public/ ${SSH_USER}@${SSH_HOST}:/home/situbamy/public_html
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Post-deploy clear caches and link storage
        run: |
          ssh ${SSH_USER}@${SSH_HOST} <<'EOF'
          # Hardcode to EA-PHP 8.2 CLI (has PDO & pdo_mysql). Fallback to default php if missing.
          PHP_BIN="/opt/cpanel/ea-php82/root/usr/bin/php"
          if [ ! -x "$PHP_BIN" ]; then
            PHP_BIN="$(command -v php)"
          fi
          echo "Using PHP: $PHP_BIN"
          "$PHP_BIN" -v
          "$PHP_BIN" -m | grep -iE '^PDO$|^pdo_mysql$' >/dev/null 2>&1 || { echo "PDO extension missing on $PHP_BIN"; exit 1; }

          rm -f /home/situbamy/situba/public/hot /home/situbamy/public_html/hot
          cd /home/situbamy/situba
          "$PHP_BIN" artisan storage:link
          "$PHP_BIN" artisan config:clear
          "$PHP_BIN" artisan route:clear
          "$PHP_BIN" artisan view:clear
          "$PHP_BIN" artisan event:clear
          ln -sfn /home/situbamy/situba/storage/app/public /home/situbamy/public_html/storage
          "$PHP_BIN" artisan up || true
          EOF
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
