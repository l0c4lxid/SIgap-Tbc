name: Deploy SITUBA

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, iconv, sockets, gd, zip, fileinfo
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm run build

      - name: Ensure Vite hot file is removed
        run: |
          rm -f public/hot

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${SSH_HOST}" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Pre-deploy server cleanup (Free disk space)
        run: |
          ssh ${SSH_USER}@${SSH_HOST} <<'EOF'
          # Truncate old Laravel logs
          if [ -d "/home/situbamy/situba/storage/logs" ]; then
            find /home/situbamy/situba/storage/logs -type f -name "*.log" -exec truncate -s 0 {} + 2>/dev/null || true
          fi

          # Clear view and cache files on server
          rm -rf /home/situbamy/situba/storage/framework/cache/data/* 2>/dev/null || true
          rm -rf /home/situbamy/situba/storage/framework/views/*.php 2>/dev/null || true

          # Clean cPanel trash & temp files
          rm -rf ~/.trash/* ~/.trash/.* 2>/dev/null || true
          rm -rf ~/tmp/* 2>/dev/null || true
          EOF
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Rsync project to server
        run: |
          rsync -az \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='.editorconfig' \
            --exclude='phpunit.xml' \
            --exclude='pint.json' \
            --exclude='phpstan.neon*' \
            --exclude='storage/logs/*.log' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ ${SSH_USER}@${SSH_HOST}:/home/situbamy/situba
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}


      - name: Rsync public to web root
        run: |
          rsync -az \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='index.php' \
            ./public/ ${SSH_USER}@${SSH_HOST}:/home/situbamy/public_html
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Post-deploy clear caches and link storage
        run: |
          ssh ${SSH_USER}@${SSH_HOST} <<'EOF'
          # Hardcode to EA-PHP 8.2 CLI (has PDO & pdo_mysql). Fallback to default php if missing.
          PHP_BIN="/opt/cpanel/ea-php82/root/usr/bin/php"
          if [ ! -x "$PHP_BIN" ]; then
            PHP_BIN="$(command -v php)"
          fi
          echo "Using PHP: $PHP_BIN"
          "$PHP_BIN" -v
          "$PHP_BIN" -m | grep -iE '^PDO$|^pdo_mysql$' >/dev/null 2>&1 || { echo "PDO extension missing on $PHP_BIN"; exit 1; }

          rm -f /home/situbamy/situba/public/hot /home/situbamy/public_html/hot
          cd /home/situbamy/situba

          # --- Setup / Buat Database Baru via cPanel uAPI ---
          CP_USER="$(whoami)"
          NEW_DB_NAME="situba_app"
          NEW_DB_USER="situba_usr"
          NEW_DB_PASS="SitubaSecure2026!#"

          FULL_DB="${CP_USER}_${NEW_DB_NAME}"
          FULL_USER="${CP_USER}_${NEW_DB_USER}"

          echo "Membuat database: $FULL_DB dan user: $FULL_USER..."
          uapi Mysql create_database name="${FULL_DB}"
          uapi Mysql create_user name="${FULL_USER}" password="${NEW_DB_PASS}"
          uapi Mysql set_privileges_on_database user="${FULL_USER}" database="${FULL_DB}" privileges=ALL%20PRIVILEGES

          # Update .env di server dengan kredensial database baru
          if [ -f "/home/${CP_USER}/situba/.env" ]; then
            cd "/home/${CP_USER}/situba"
            grep -q "^DB_DATABASE=" .env && sed -i "s|^DB_DATABASE=.*|DB_DATABASE=${FULL_DB}|" .env || echo "DB_DATABASE=${FULL_DB}" >> .env
            grep -q "^DB_USERNAME=" .env && sed -i "s|^DB_USERNAME=.*|DB_USERNAME=${FULL_USER}|" .env || echo "DB_USERNAME=${FULL_USER}" >> .env
            grep -q "^DB_PASSWORD=" .env && sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=\"${NEW_DB_PASS}\"|" .env || echo "DB_PASSWORD=\"${NEW_DB_PASS}\"" >> .env
            echo "File .env berhasil diperbarui dengan database baru: ${FULL_DB}"
          fi

          "$PHP_BIN" artisan storage:link
          "$PHP_BIN" artisan config:clear
          "$PHP_BIN" artisan route:clear
          "$PHP_BIN" artisan view:clear
          "$PHP_BIN" artisan event:clear
          ln -sfn /home/situbamy/situba/storage/app/public /home/situbamy/public_html/storage
          "$PHP_BIN" artisan up || true
          EOF
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
