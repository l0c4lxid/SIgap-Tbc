name: Deploy to Shared Hosting (incremental)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, ctype, fileinfo, json, tokenizer, xml, pdo, pdo_mysql, openssl, curl, zip, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy CI environment
        run: cp .env.ci .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Directory permissions
        run: |
          sudo chown -R $USER:$USER storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      - name: Run PHPStan (Larastan)
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --error-format=table

      - name: Run tests
        run: php artisan test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Determine changed files
        id: changes
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1)"
          fi

          git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt || true

          run_npm="false"
          if grep -E '^(resources/|package(-lock)?\\.json|vite\\.config\\.js|tailwind\\.config\\.js)' /tmp/changed_files.txt >/dev/null 2>&1; then
            run_npm="true"
          fi

          core_paths_regex='^(app/|bootstrap/|config/|database/|routes/|resources/|lang/|composer\\.json|composer\\.lock|artisan|server\\.php)'
          grep -E "$core_paths_regex" /tmp/changed_files.txt > /tmp/changed_core.txt || true
          grep -E '^public/' /tmp/changed_files.txt > /tmp/changed_public.txt || true

          echo "run_npm=$run_npm" >> "$GITHUB_OUTPUT"
          echo "has_core_files=$( [ -s /tmp/changed_core.txt ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "has_public_files=$( [ -s /tmp/changed_public.txt ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (NPM)
        if: steps.changes.outputs.run_npm == 'true'
        run: npm ci --legacy-peer-deps

      - name: Clean old Vite build
        if: steps.changes.outputs.run_npm == 'true'
        run: rm -rf public/build

      - name: Build assets (Vite)
        if: steps.changes.outputs.run_npm == 'true'
        run: npm run build

      - name: Prepare core deploy bundle (only changed app/config/views/etc)
        run: |
          set -euo pipefail
          rm -rf deploy-core
          mkdir -p deploy-core
          if [ -s /tmp/changed_core.txt ]; then
            rsync -a --files-from=/tmp/changed_core.txt ./ deploy-core/ \
              --exclude 'node_modules' \
              --exclude 'public' \
              --exclude 'storage/logs' \
              --exclude 'storage/framework/cache' \
              --exclude 'storage/framework/sessions' \
              --exclude 'storage/framework/views' \
              --exclude 'bootstrap/cache/config.php' \
              --exclude 'bootstrap/cache/routes-*.php' \
              --exclude 'bootstrap/cache/events-*.php' \
              --exclude 'bootstrap/cache/services.php' \
              --exclude '.git' \
              --exclude '.github' \
              --exclude '.cpanel*' \
              --exclude 'resources/assets' \
              --exclude 'resources/js' \
              --exclude 'resources/sass' \
              --exclude 'resources/less' \
              --exclude 'vendor'
          fi

      - name: Prepare public deploy bundle (assets & public changes)
        run: |
          set -euo pipefail
          rm -rf deploy-public
          mkdir -p deploy-public
          if [ -s /tmp/changed_public.txt ]; then
            rsync -a --files-from=/tmp/changed_public.txt ./ deploy-public/
          fi
          if [ "${{ steps.changes.outputs.run_npm }}" = "true" ]; then
            rsync -a public/build/ deploy-public/build/
          fi

          # Adjust front controller path for shared hosting
          if [ -f deploy-public/index.php ]; then
            sed -i "s#__DIR__.'/../#\0situba/#" deploy-public/index.php
          fi

      - name: Deploy core Laravel to /home/situbamy/situba (delta only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-core/
          server-dir: ./situba/
          state-name: .ftp-deploy-core-state.json
          timeout: 300000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            node_modules/**
            public/**
            tests/**
            resources/assets/**
            resources/js/**
            resources/sass/**
            resources/less/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            .cpanel.yml
            **/.cpanel.yml
            **/.cpanel*

      - name: Deploy public folder to /home/situbamy/public_html (delta only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-public/
          server-dir: ./public_html/
          state-name: .ftp-deploy-public-state.json
          timeout: 300000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            node_modules/**
            .cpanel.yml
            **/.cpanel.yml
            **/.cpanel*
            vendor/**
            pages/**
            pdf/**
