name: Deploy to Shared Hosting (incremental)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo_mysql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (Composer)
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Install dependencies (NPM)
        run: npm ci --legacy-peer-deps

      - name: Clean old Vite build
        run: rm -rf public/build

      - name: Build assets (Vite)
        run: npm run build

      - name: Prepare core deploy bundle
        run: |
          set -euo pipefail
          rm -rf deploy-core
          mkdir -p deploy-core
          rsync -a ./ deploy-core/ \
            --exclude 'node_modules' \
            --exclude 'public' \
            --exclude 'storage/logs' \
            --exclude 'storage/framework/cache' \
            --exclude 'storage/framework/sessions' \
            --exclude 'storage/framework/views' \
            --exclude 'bootstrap/cache/config.php' \
            --exclude 'bootstrap/cache/routes-*.php' \
            --exclude 'bootstrap/cache/events-*.php' \
            --exclude 'bootstrap/cache/services.php' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cpanel*' \
            --exclude 'resources/assets' \
            --exclude 'resources/js' \
            --exclude 'resources/sass' \
            --exclude 'resources/less'

          rsync -a vendor/ deploy-core/vendor/

      - name: Prepare public deploy bundle
        run: |
          set -euo pipefail
          rm -rf deploy-public
          mkdir -p deploy-public
          rsync -a public/ deploy-public/

          # Adjust front controller path for shared hosting
          if [ -f deploy-public/index.php ]; then
            sed -i "s#__DIR__.'/../#\0situba/#" deploy-public/index.php
          fi

      - name: Deploy core Laravel to /home/situbamy/situba (delta only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-core/
          server-dir: ./situba/
          state-name: .ftp-deploy-core-state.json
          timeout: 300000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            node_modules/**
            public/**
            tests/**
            resources/assets/**
            resources/js/**
            resources/sass/**
            resources/less/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            .cpanel.yml
            **/.cpanel.yml
            **/.cpanel*

      - name: Deploy public folder to /home/situbamy/public_html (delta only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-public/
          server-dir: ./public_html/
          state-name: .ftp-deploy-public-state.json
          timeout: 300000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            node_modules/**
            .cpanel.yml
            **/.cpanel.yml
            **/.cpanel*
            vendor/**
            pages/**
            pdf/**
