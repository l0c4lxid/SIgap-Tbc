name: Deploy Laravel via FTP

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup PHP + Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, intl, pdo_mysql

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install pnpm with Corepack
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install frontend dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build frontend assets
        run: |
          if [ -f package.json ]; then
            if node -e "const pkg=require('./package.json');process.exit(pkg.scripts && pkg.scripts.build ? 0 : 1)"; then
              pnpm run build || npm run build
            else
              echo "No build script found, skipping."
            fi
          else
            echo "No package.json found, skipping."
          fi

      # Cache config/route (best effort)
      - name: Cache config and routes
        run: |
          if [ -f artisan ]; then
            php artisan config:cache || true
            php artisan route:cache || true
          fi

      # Generate public/index.php for shared hosting
      - name: Generate public index.php
        run: |
          if [ -d public ]; then
            cat > public/index.php <<'PHP'
<?php

use Illuminate\Contracts\Http\Kernel;
use Illuminate\Http\Request;

define('LARAVEL_START', microtime(true));

require '/home/situbamy/situba/vendor/autoload.php';

$app = require_once '/home/situbamy/situba/bootstrap/app.php';

$kernel = $app->make(Kernel::class);

$response = $kernel->handle(
    $request = Request::capture()
)->send();

$kernel->terminate($request, $response);
PHP
          fi

      # Deploy app core to /situba (exclude public/)
      - name: Deploy core to /situba
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: situba/
          state-name: .ftp-deploy-core-state.json
          timeout: 300000
          dangerous-clean-slate: false
          exclude: |
            .git/**
            .github/**
            node_modules/**
            public/**
            tests/**
            storage/logs/**
            .env
            .env.*
            README*
            *.md

      # Deploy public assets to /public_html
      - name: Deploy public to /public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: public_html/
          state-name: .ftp-deploy-public-state.json
          timeout: 300000
          dangerous-clean-slate: false
          exclude: |
            .git/**
            .github/**
            node_modules/**
