name: Deploy SITUBA

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build assets (Vite)
        run: |
          npm ci || npm install
          npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Put app into maintenance mode
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd '${{ secrets.SSH_PATH }}'; if [ -n '${{ secrets.MAINTENANCE_SECRET }}' ]; then php artisan down --secret='${{ secrets.MAINTENANCE_SECRET }}' --retry=60 --refresh=15; else php artisan down --retry=60 --refresh=15; fi"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".env" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}/"

      - name: Laravel optimize on server
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd '${{ secrets.SSH_PATH }}'; composer install --no-dev --optimize-autoloader || ~/bin/composer install --no-dev --optimize-autoloader; php artisan config:cache; php artisan route:cache || true; php artisan view:cache || true"

      - name: Bring app back up
        if: always()
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.SSH_PATH }}' && php artisan up || true"
