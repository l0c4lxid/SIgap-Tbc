name: Deploy Laravel to Shared Hosting

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup PHP + Composer cache
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      # Setup Node.js + pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install frontend dependencies
        run: |
          if command -v pnpm >/dev/null 2>&1; then
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi
          else
            npm install
          fi

      - name: Build frontend assets
        run: |
          if command -v pnpm >/dev/null 2>&1; then
            pnpm run build
          else
            npm run build
          fi

      # Cache config/route (best effort)
      - name: Cache config and routes
        run: |
          if [ -f artisan ]; then
            php artisan config:cache || true
            php artisan route:cache || true
          fi

      # Generate public/index.php for shared hosting
      - name: Generate public index.php
        run: |
          if [ -d public ]; then
            cat > public/index.php <<'PHP'
            <?php

            use Illuminate\Contracts\Http\Kernel;
            use Illuminate\Http\Request;

            define('LARAVEL_START', microtime(true));

            require '/situba/vendor/autoload.php';

            $app = require_once '/situba/bootstrap/app.php';

            $kernel = $app->make(Kernel::class);

            $response = $kernel->handle(
                $request = Request::capture()
            )->send();

            $kernel->terminate($request, $response);
            PHP
          fi

      # Deploy app core to /situba (exclude public/)
      - name: Deploy core to /situba
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /situba/
          state-name: .ftp-deploy-core-state.json
          timeout: 300000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            node_modules/**
            public/**
            tests/**
            storage/logs/**
            .env
            .env.*
            .env*

      # Deploy public assets to /public_html
      - name: Deploy public to /public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./public/
          server-dir: /public_html/
          state-name: .ftp-deploy-public-state.json
          timeout: 300000
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            node_modules/**
